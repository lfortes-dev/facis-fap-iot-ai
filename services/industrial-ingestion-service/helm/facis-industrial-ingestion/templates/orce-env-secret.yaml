{{- if .Values.orcePodEnv.renderSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.orcePodEnv.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "facis-industrial-ingestion.labels" . | nindent 4 }}
    app.kubernetes.io/component: orce-env
type: Opaque
stringData:
  MODBUS_HOST: {{ .Values.modbus.host | quote }}
  MODBUS_PORT: {{ .Values.modbus.port | quote }}
  MODBUS_UNIT_ID: {{ .Values.modbus.unitId | quote }}
  MODBUS_POLL_MS: {{ .Values.modbus.pollMs | quote }}
  MODBUS_BASE_ADDRESS: {{ .Values.modbus.baseAddress | quote }}
  MODBUS_DEVICE_ID: {{ .Values.modbus.deviceId | quote }}
  MODBUS_INGEST_TOPIC: {{ .Values.modbus.ingestTopic | quote }}
  OPCUA_ENDPOINT: {{ .Values.opcua.endpoint | quote }}
  OPCUA_POLL_MS: {{ .Values.opcua.pollMs | quote }}
  OPCUA_NODE_PREFIX: {{ .Values.opcua.nodePrefix | quote }}
  OPCUA_DEVICE_ID: {{ .Values.opcua.deviceId | quote }}
  OPCUA_INGEST_TOPIC: {{ .Values.opcua.ingestTopic | quote }}
  INDING_SITE_ID: {{ .Values.ingest.siteId | quote }}
  INDING_DLQ_TOPIC: {{ .Values.ingest.dlqTopic | quote }}
  INDING_KAFKA_BROKERS: {{ .Values.kafka.brokers | quote }}
{{- end }}
